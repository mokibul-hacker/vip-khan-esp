<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Khan ESP Panel</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 20px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            text-align: center;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        #msg {
            margin-top: 12px;
            font-size: 13px;
        }
        /* Dashboard Panel Style */
        .dashboard {
            display: none;
            text-align: left;
        }
        .section-title {
            font-size: 12px;
            color: #8b949e;
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #30363d;
            padding-bottom: 3px;
        }
        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #21262d;
            font-size: 13px;
        }
        .special-hack {
            border: 1px solid #ff7b72;
            background: rgba(255, 123, 114, 0.05);
        }
        .special-hack span {
            color: #ff7b72;
            font-weight: bold;
        }
        /* Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #238636; }
        .special-hack input:checked + .slider { background-color: #ff7b72; }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

    <div class="box" id="mainContainer">
        <!-- Login Form -->
        <div id="loginView">
            <h2>VIP KHAN LOADER</h2>
            <input type="password" id="keyInput" placeholder="Enter Key (789685)">
            <button onclick="verifyKey()">LOGIN</button>
            <div id="msg"></div>
        </div>

        <!-- ESP Dashboard View -->
        <div class="dashboard" id="dashView">
            <h2>VIP KHAN - ESP MENU</h2>
            
            <div class="section-title">Visuals (ESP)</div>
            <div class="toggle-item">
                <span>ESP Line</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="toggle-item">
                <span>ESP Box</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="toggle-item">
                <span>Health Bar</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="toggle-item">
                <span>Distance</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>

            <div class="section-title">Advanced Hacks</div>
            <div class="toggle-item special-hack">
                <span>🎯 Bullet Tracking</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="toggle-item special-hack">
                <span>✨ Magic Bullet</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
        </div>
    </div>

    <script>
        function verifyKey() {
            var val = document.getElementById("keyInput").value;
            var msgBox = document.getElementById("msg");

            if (val === "789685") {
                document.getElementById("loginView").style.display = "none";
                document.getElementById("dashView").style.display = "block";
            } else {
                msgBox.style.color = "#ff4d4d";
                msgBox.innerText = "गलत की है! (सही की: 789685)";
            }
        }
    </script>

</body>
</html>
