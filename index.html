<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Khan Loader</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        #msg {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="box" id="mainBox">
        <h2>VIP KHAN LOADER</h2>
        <input type="text" id="keyInput" placeholder="Enter Key (789685)">
        <button onclick="verifyKey()">LOGIN</button>
        <div id="msg"></div>
    </div>

    <script>
        function verifyKey() {
            var val = document.getElementById("keyInput").value;
            var msgBox = document.getElementById("msg");

            if (val === "789685") {
                msgBox.style.color = "#2ea043";
                msgBox.innerHTML = "<b>Success! Loader Connected. 🔥</b>";
                setTimeout(function() {
                    document.getElementById("mainBox").innerHTML = "<h1 style='color: #2ea043;'>Welcome VIP Khan!</h1><p>Panel Active Successfully.</p>";
                }, 1000);
            } else {
                msgBox.style.color = "#ff4d4d";
                msgBox.innerText = "गलत की है! सही की (789685) डालें।";
            }
        }
    </script>

</body>
</html>
